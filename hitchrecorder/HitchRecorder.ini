; HitchRecorder - writes down frame times and what the engine was doing at the time.
; It only watches: every hooked function runs exactly as before, the recorder just times it.
; Recordings go to the "recordings" folder next to this file. Delete this folder to remove the mod.
; Night City Frame Lab puts this folder into a game build for one session and takes it out again
; afterwards, so normally it is not in the game at all. Frame Lab writes the settings below for its
; session (Enabled=1, CaptureMode=2, SessionOnly=1).

[Recorder]
; 1 = record, 0 = do nothing at all
Enabled=1

; 2 = session (Frame Lab): record the whole game run; the capture key marks the part to look at
; 1 = record only between presses of the capture key (F11)
; 0 = record the whole time the game runs
CaptureMode=1

; 1 = one game run only: sets Enabled=0 above as soon as the game has started, so the next start
; is clean even if Frame Lab never gets to take the recorder out (game or PC crash)
SessionOnly=0

; capture key (Windows key code): 122 = F11
CaptureKey=122

; resource loading: load requests, deserialising, world sectors, the loader's per-frame update
RecordLoads=1

; entity spawns (Entity::Attach)
RecordEntities=1

; REDscript time per mod: how long each mod's .reds code (and the game's own scripts) runs.
; Timed only while recording is on; in session mode (2) only inside the F11 parts, because timing
; every script call costs a little. Game 2.31 only, stays off on other versions.
RecordScripts=1

; CET Lua time per mod: how long each CET mod's callbacks (onUpdate, onDraw, Observe, Override, hotkeys)
; run, including the game script code they call. Same timing rule as RecordScripts. Needs CET with its
; usual LuaJIT (checked by its machine code at start; stays off if it doesn't match).
RecordCET=1

; D3D12 shader / pipeline creation (the classic shader-compile stutter)
RecordShaders=1

; D3D12 texture, buffer and heap creation
RecordGpuMemory=1

; the game's own VRAM use against its budget, 5 times a second
RecordVram=1

; frames slower than this (ms) get a SPIKE line in the .log
SpikeMs=50

; stop writing the .bin once it reaches this size in MB (the .log keeps going)
MaxMB=2048

; seconds per summary block in the .log
SummarySeconds=60

; press this key in game to drop a marker into the recording, e.g. right after you feel a stutter
; 145 = Scroll Lock, 19 = Pause, 0 = off
MarkKey=145
